<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hair Designs - Pandora</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fcfcfc; }
        
        header {
            background-color: #7a1b30;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .back-btn {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
        }

        .gallery-container {
            padding: 50px 10%;
            text-align: center;
        }

        .gallery-container h2 { color: #7a1b30; margin-bottom: 30px; }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .photo-grid img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .photo-grid img:hover { transform: translateY(-10px); }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 24px; font-weight: bold; color: #d4af37;">Pandora Hair Designs</div>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> ရှေ့စာမျက်နှာသို့ ပြန်ရန်</a>
    </header>

    <div class="gallery-container">
        <h2>ကျွန်ုပ်တို့ ဖန်တီးထားသော ဆံပင်ဒီဇိုင်းများ</h2>
        
        <div class="photo-grid">
            <img src="hair1.jpg" alt="Design 1">
            <img src="hair2.jpg" alt="Design 2">
            <img src="hair3.jpg" alt="Design 3">
            <img src="hair4.jpg" alt="Design 4">
            <img src="hair5.jpg" alt="Design 5">
            <img src="hair6.jpg" alt="Design 6">
            <img src="hair7.jpg" alt="Design 7">	
	    <img src="hair8.jpg" alt="Design 8">	
	    <img src="hair9.jpg" alt="Design 9">
            <img src="hair10.jpg" alt="Design 10">
	    <img src="hair11.jpg" alt="Design 11">
            <img src="hair12.jpg" alt="Design 12">
            <img src="hair13.jpg" alt="Design 13">
            <img src="hair14.jpg" alt="Design 14">
            <img src="hair15.jpg" alt="Design 15">
            <img src="hair16.jpg" alt="Design 16">
            <img src="hair17.jpg" alt="Design 17">
            <img src="hair18.jpg" alt="Design 18">
            <img src="hair19.jpg" alt="Design 19">
            <img src="hair20.jpg" alt="Design 20">
	</div>
    </div>

</body>
</html>
